<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>{{ format_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: #1d876a;
      color: #fff;
      overflow: hidden;
    }

    .creative-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 10px;
      overflow: hidden;
    }

    .content::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: clamp(400px, 70vw, 1000px);
      height: calc(100vh + 10px);
      background: radial-gradient(
        ellipse 50% 100% at 50% 0%,
        rgba(9, 35, 48, 1) 0%,
        rgba(29, 135, 106, 0) 100%
      );
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content h1 {
      margin: 10px 0;
      font-size: clamp(12px, 2.5vw, 24px);
    }

    .content p {
      margin: 0 0 10px;
      font-size: clamp(10px, 1.8vw, 16px);
    }

    .content a {
      color: #90f0e5;
      text-decoration: none;
      opacity: 0.9;
    }

    .content a:hover { opacity: 1; }

    @media (max-width: 600px) {
      .creative-wrapper { padding: 6px; }
      .content::before {
        top: -6px;
        width: 100vw;
        height: calc(100vh + 6px);
      }
      .content h1 { margin: 6px 0; font-size: clamp(10px, 4vw, 18px); }
      .content p  { margin: 0 0 6px; font-size: clamp(8px, 3vw, 13px); }
    }

    @media (max-height: 400px) {
      .creative-wrapper { padding: 4px; }
      .content::before {
        top: -4px;
        height: calc(100vh + 4px);
      }
      .content h1 { margin: 4px 0; font-size: clamp(8px, 2vh, 14px); }
      .content p  { margin: 0 0 4px; font-size: clamp(7px, 1.6vh, 11px); }
    }
  </style>
</head>
<body>
  <div class="creative-wrapper">
    <div class="content">
      {% block creative %}
      <h1>{{ format_name }}</h1>
      <p>{{ description }}</p>
      <a href="{{ link }}" target="_blank">{{ format_name }}</a>
      {% endblock %}
    </div>
  </div>
</body>
</html>
